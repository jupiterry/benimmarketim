# Include inside the HTTPS server block. API and socket proxy locations remain unchanged.
location = / {
    root /var/www/benimmarketim/frontend/dist;
    add_header Cache-Control "no-cache";
    try_files /seo-home/index.html =404;
}
location = /sitemap.xml {
    root /var/www/benimmarketim/frontend/dist;
    default_type application/xml;
    add_header Cache-Control "no-cache";
    try_files /sitemap.xml =404;
}
location = /robots.txt {
    root /var/www/benimmarketim/frontend/dist;
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /robots.txt =404;
}
location ~ ^/category/([a-z0-9-]+)/?$ {
    root /var/www/benimmarketim/frontend/dist;
    add_header Cache-Control "no-cache";
    try_files /category/$1/index.html =404;
}
