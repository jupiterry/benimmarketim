plugins {
    id 'com.android.application'
}

// İmza bilgisi keystore/keystore.properties içindedir (git'e eklenmez). Dosya yoksa release imzasız kalır.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore/keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.benimmarketim.siparisalarm'
    compileSdk 35

    defaultConfig {
        applicationId "com.benimmarketim.siparisalarm"
        minSdk 26
        targetSdk 35
        // Sürüm yükseltirken BuildInfo.VERSION_NAME de değiştirilmeli.
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file("keystore/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Ek kütüphane yok: yalnızca Android'in kendi API'leri kullanılır.
