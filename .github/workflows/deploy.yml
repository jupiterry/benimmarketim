name: Web production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benimmarketim-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: bash -n ops/deploy/deploy.sh ops/deploy/ssh-entry.sh
      - run: python3 ops/deploy/test_deploy.py
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ai-support
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend
      - run: node frontend/scripts/check-seo.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Deploy the tested commit over key-only SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SSH_USER" != root ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9_/-]+$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf -- "$key_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -T -i "$key_dir/key" -p "$SSH_PORT" \
            -o BatchMode=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$SSH_USER@$SSH_HOST" "deploy $GITHUB_SHA $APP_DIR"
      - name: Check public website and API
        shell: bash
        run: |
          set -euo pipefail
          for url in https://devrekbenimmarketim.com/ https://devrekbenimmarketim.com/api/products; do
            code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$url")
            [[ "$code" == 200 ]] || { echo 'Public health check failed'; exit 1; }
          done
